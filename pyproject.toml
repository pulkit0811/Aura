[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["^tests/"]

